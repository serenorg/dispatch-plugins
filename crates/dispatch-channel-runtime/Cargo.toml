[package]
name = "dispatch-channel-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared runtime helpers for Dispatch channel plugins."
repository.workspace = true
keywords = ["dispatch", "channel", "runtime", "plugins"]
categories = ["command-line-utilities"]

[lib]
name = "dispatch_channel_runtime"
path = "src/lib.rs"

[dependencies]
atomicwrites = "0.4"
dispatch-channel-protocol = { git = "https://github.com/serenorg/dispatch", tag = "v0.8.0" }
fs2 = "0.4"
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }
