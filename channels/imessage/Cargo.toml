[package]
name = "channel-imessage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dispatch channel plugin for iMessage through BlueBubbles."
repository.workspace = true
keywords = ["dispatch", "channel", "imessage", "bluebubbles", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "channel-imessage"
path = "src/main.rs"

[dependencies]
dispatch-channel-protocol = { git = "https://github.com/serenorg/dispatch", tag = "v0.8.0" }
dispatch-channel-runtime = { path = "../../crates/dispatch-channel-runtime" }
hmac = "0.13"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
ureq = { version = "3", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
channel-schema = { path = "../schema" }
