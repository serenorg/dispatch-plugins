[package]
name = "channel-signal"
version.workspace = true
edition.workspace = true
# channel-signal links against presage, which is AGPL-3.0. The combined
# binary is therefore distributed under AGPL-3.0.
license = "AGPL-3.0"
publish = false
description = "Dispatch channel plugin for Signal via native Rust presage client."
repository.workspace = true
keywords = ["dispatch", "channel", "signal", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "channel-signal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
dispatch-channel-protocol = { git = "https://github.com/serenorg/dispatch", tag = "v0.7.0" }
futures = "0.3"
jiff = "0.2"
libsqlite3-sys = { version = "0.36", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
presage = { git = "https://github.com/whisperfish/presage", rev = "f74b96e0fb9099ce8be2b28b7ca9d11f78a6faea" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "f74b96e0fb9099ce8be2b28b7ca9d11f78a6faea", default-features = false }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
