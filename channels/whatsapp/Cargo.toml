[package]
name = "channel-whatsapp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Dispatch channel plugin for WhatsApp via native Rust whatsapp-rust."
repository.workspace = true
keywords = ["dispatch", "channel", "whatsapp", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "channel-whatsapp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
dispatch-channel-protocol = { git = "https://github.com/serenorg/dispatch", tag = "v0.7.0" }
futures = "0.3"
jiff = "0.2"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
url = "2"
wacore = { version = "0.6", default-features = false }
whatsapp-rust = { version = "0.6", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }
whatsapp-rust-sqlite-storage = "0.6"
whatsapp-rust-tokio-transport = "0.6"
whatsapp-rust-ureq-http-client = "0.6"
